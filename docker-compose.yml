version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    volumes:
      - shopflow_pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  shopflow_pgdata:
