version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    volumes:
      - shopflow_pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: shopflow_redis
    ports:
      - '6380:6379'
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopflow_api
    environment:
      - DATABASE_URL=postgresql://postgres:123456@postgres:5432/postgres?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super-secret-key-ecommerce-2026
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  shopflow_pgdata:
